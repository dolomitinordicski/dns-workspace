<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DNS Saisonkarte 00000 · Demo</title>
<style>:root{font-family:Arial,Helvetica,sans-serif;color:#123e4b;background:#eef5f5}*{box-sizing:border-box}body{margin:0;padding:24px 12px}.wrap{max-width:420px;margin:auto}.pass{background:#123e4b;color:white;border-radius:22px;padding:25px;box-shadow:0 14px 35px #123e4b30}.top{display:flex;justify-content:space-between;align-items:start;font-weight:800;letter-spacing:1px}.snow{font-size:32px;color:#aad0d1}.tag{font-size:12px;color:#aad0d1;margin-top:28px;letter-spacing:2px}h1{font-size:29px;margin:9px 0}.season{color:#d8eeee}.num{font-size:34px;font-weight:800;letter-spacing:4px;margin:18px 0}.qr{background:white;color:#123e4b;border-radius:14px;text-align:center;padding:24px;margin-top:18px}.qr svg{width:145px;height:145px}.status{display:flex;justify-content:space-between;margin-top:18px;align-items:center}.pill{padding:8px 13px;border-radius:30px;background:#637e86;color:white;font-size:12px;font-weight:bold}.pill.on{background:#b5e3cf;color:#0c4834}button{width:100%;padding:16px;border:0;border-radius:12px;margin-top:16px;font-size:16px;font-weight:700;background:#aad0d1;color:#123e4b;cursor:pointer}button.secondary{background:white;border:1px solid #a6c5c8}.note{font-size:13px;line-height:1.5;color:#58767d;text-align:center;margin-top:20px}.result{text-align:center;margin-top:12px;font-weight:700}</style></head>
<body><div class="wrap"><div class="pass"><div class="top"><img src="https://raw.githubusercontent.com/dolomitinordicski/dns-shared-data/foundation-v1.3.0/brand/logo-web.png" alt="Dolomiti NordicSki" style="display:block;max-width:205px;width:75%;height:auto;object-fit:contain" /></div><div class="tag">DIGITAL PASS · DEMO</div><h1>DNS Saisonkarte</h1><div class="season">Wintersaison 2026/27</div><div class="num">00000</div><div class="qr"><svg viewBox="0 0 100 100" role="img" aria-label="Demo, kein gültiger QR-Code"><g fill="#123e4b"><path d="M0 0h30v30H0zM5 5v20h20V5zM70 0h30v30H70zM75 5v20h20V5zM0 70h30v30H0zM5 75v20h20V75z" fill-rule="evenodd"/><path d="M10 10h10v10H10zM80 10h10v10H80zM10 80h10v10H10zM38 0h7v12h-7zM50 0h10v8H50zM37 20h15v8H37zM60 33h7v20h-7zM35 38h20v8H35zM0 39h12v8H0zM18 35h10v20H18zM35 57h15v8H35zM56 60h15v10H56zM75 40h25v8H75zM80 55h8v15h-8zM37 75h15v9H37zM57 80h10v20H57zM75 80h25v9H75zM38 90h12v10H38z"/></g></svg><div style="font-size:12px">DEMO · NICHT GÜLTIG</div></div><div class="status"><span>Ticketstatus</span><span id="status" class="pill">NICHT AKTIV</span></div></div><button id="toggle">Saisonkarte aktivieren (Demo)</button><button class="secondary" id="scan">Kontrolle simulieren</button><div id="result" class="result" role="status"></div><p class="note">Nur Vorführung. Kein echtes Ticket, keine Registrierung, keine Firestore-Schreibvorgänge und keine gültige QR-Signatur.</p></div><script>let active=false;document.getElementById('toggle').onclick=()=>{active=!active;document.getElementById('status').textContent=active?'AKTIV · DEMO':'NICHT AKTIV';document.getElementById('status').classList.toggle('on',active);document.getElementById('toggle').textContent=active?'Demo zurücksetzen':'Saisonkarte aktivieren (Demo)';document.getElementById('result').textContent=''};document.getElementById('scan').onclick=()=>{document.getElementById('result').textContent=active?'✓ 00000 · Demo-Kontrolle erfolgreich':'Bitte zuerst die Demo-Saisonkarte aktivieren'}</script></body></html>
