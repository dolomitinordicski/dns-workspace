name: Deploy DNS Workspace to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      digital_pass_pilot:
        description: 'Enable the separately approved Digital Pass pilot (requires configured repo variables)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: dns-workspace-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Foundation before installation
        run: node scripts/foundation-lock.mjs
      - run: npm ci --no-audit --no-fund
      - name: Verify installed Foundation
        run: node scripts/foundation-lock.mjs --installed
      - run: npm run validate
      - run: node --test tests/ai-collaboration-preliminary.test.mjs
      - run: node --test tests/digital-pass-pilot-build.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Foundation before installation
        run: node scripts/foundation-lock.mjs
      - run: npm ci --no-audit --no-fund
      - name: Verify installed Foundation
        run: node scripts/foundation-lock.mjs --installed
      - name: Validate Digital Pass release gate
        env:
          DNS_PILOT_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.digital_pass_pilot && 'true' || 'false' }}
          DNS_PASS_PILOT_APPROVED: ${{ vars.DNS_PASS_PILOT_APPROVED }}
          DNS_PASS_API_BASE: ${{ vars.DNS_PASS_API_BASE }}
          DNS_PASS_PRIVACY_URL: ${{ vars.DNS_PASS_PRIVACY_URL }}
        run: node scripts/check-digital-pass-pilot-build.mjs
      - name: Build Workspace
        env:
          VITE_DNS_DIGITAL_PASS_API_BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.digital_pass_pilot && vars.DNS_PASS_PILOT_APPROVED == 'true' && vars.DNS_PASS_API_BASE || '' }}
          VITE_DNS_PASS_ACTIVATION_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.digital_pass_pilot && vars.DNS_PASS_PILOT_APPROVED == 'true' && 'true' || 'false' }}
          VITE_DNS_DIGITAL_PASS_PRIVACY_URL: ${{ vars.DNS_PASS_PRIVACY_URL }}
        run: npm run build
      - name: Collect verified public development summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DNS_AI_IMPACT_PUBLISH: 'false'
          DNS_AI_IMPACT_START: ${{ vars.DNS_AI_IMPACT_START }}
        run: |
          node scripts/ai-impact-collector.mjs
          mkdir -p dist/ai-impact
          cp ai-impact-output/public-summary.json dist/ai-impact/latest.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
