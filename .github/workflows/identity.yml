name: DNS Identity isolated emulator tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run validate
      - run: npm run test:identity:app
      - run: npx playwright install --with-deps chromium
      - run: npm run test:identity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dns-identity-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
