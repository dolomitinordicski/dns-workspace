name: Workspace access request acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm ci --prefix server --no-audit --no-fund
      - run: npm run build
      - run: node tests/identity/check-production-build.mjs
      - run: npx playwright install --with-deps chromium
      - name: Isolated backend, callable and browser acceptance
        run: npx firebase emulators:exec --config firebase.access.json --only auth,firestore,functions --project demo-dns-identity "node --test --test-concurrency=1 server/tests/*.test.mjs && npx playwright test --config playwright.identity.config.ts"
        env:
          GCLOUD_PROJECT: demo-dns-identity
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8188
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9199
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-access-acceptance
          path: |
            playwright-report/
            test-results/
